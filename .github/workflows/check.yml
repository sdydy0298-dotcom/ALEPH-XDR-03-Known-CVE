name: Verify XDR-03 Known CVE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Replay upstream Wazuh Log4Shell fixture
        run: npm run xdr:run -- known-cve
      - name: Unit and behavioral tests
        run: npm test
      - name: Verify deterministic replay
        run: npm run xdr:run -- known-cve
      - name: Build static dashboard
        run: npm run build
      - name: Verify result/log/policy/demo match committed artifacts
        run: |
          git diff --exit-code -- xdr/known-cve/result.json xdr/alerts.log xdr/temporary-deny.json public/report.json public/samples.json public/index.html public/app.js public/styles.css public/decide.mjs
